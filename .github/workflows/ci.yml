name: CI

# Trunk-based: commits land directly on main, so push is the real trigger.
# pull_request is here for the day that changes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Source-only checks. No compiler, no GPU, no build directory. ──────────
  # This is the job that would have caught the drift the 28 Aug audit found:
  # a fabricated dependency edge, a doc pointing at a deleted file, LOC audit
  # figures gone stale, a spec never marked implemented.
  invariants:
    name: Invariants
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check architectural invariants
        shell: pwsh
        run: pwsh -NoProfile -File tools/check-invariants.ps1

      # README documents a Windows PowerShell 5.1 fallback for anyone who has
      # not installed PowerShell 7. This keeps the script *compatible* with 5.1
      # as it grows — no `??`, no ternary, no 7-only cmdlets.
      #
      # It does NOT cover the reason 5.1 actually bites a contributor: 5.1's
      # default execution policy is Restricted and refuses to run a local
      # unsigned script, whereas a hosted runner is permissive. That is a
      # machine-configuration fact CI cannot reproduce, so README carries
      # `-ExecutionPolicy Bypass` in the documented fallback instead.
      - name: Check invariants under Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/check-invariants.ps1

      # check-prereqs.ps1 inspects a machine, so a runner - which has everything -
      # can only ever see it pass. That is still worth having under both shells:
      # it catches syntax and 5.1-compatibility regressions, which is exactly how
      # this job earned its place. The first version of the script threw under 5.1
      # only, because Windows PowerShell turns a native command's stderr into an
      # error record and `cmake -P` writes its result there.
      - name: Prerequisite check runs under both shells
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/check-prereqs.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/check-prereqs.ps1

  # ── Configure and compile both shipping configurations. ──────────────────
  build:
    name: Build (Debug + Release game)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        shell: pwsh
        run: |
          cmake --version
          Write-Host "Default generator on this image:"
          cmake --system-information 2>$null | Select-String -Pattern '^CMAKE_GENERATOR ' | Select-Object -First 1

      # The `ci-build` preset deliberately sets no generator. The dev box pins
      # "Visual Studio 18 2026" via the `vs2026` preset; the runner image ships
      # whatever it ships, and letting CMake pick its default Visual Studio
      # generator keeps CI working across image updates instead of breaking the
      # day the image moves. Presets are used here so CI and the README cannot
      # drift apart on everything *else* — architecture, binary dir, options.
      # ENGINE_RHI_VULKAN is ON by default and stated here anyway, so this job
      # fails loudly if that default ever changes. It is what stops a second
      # backend rotting: rhi-vulkan vendors its own headers and volk resolves
      # the API at runtime, so it compiles on a runner with no Vulkan SDK.
      #
      # Compiles, not runs. There is no GPU here and no SDK, so no device and
      # no SPIR-V compiler - exactly the two reasons --gates is already not run
      # in this job. See the NOTE below.
      - name: Configure
        run: cmake --preset ci-build --fresh -DENGINE_RHI_VULKAN=ON

      - name: Build Debug
        run: cmake --build --preset ci-debug

      - name: Build Release game
        run: cmake --build --preset ci-release-game

      # If the runner image ever lacks the Windows SDK's dxcompiler.dll,
      # packages/game/CMakeLists.txt fails configure with a FATAL_ERROR. The
      # fallback is to add -DENGINE_BUILD_GAME=OFF to the Configure step above
      # and drop this one; the engine and sandbox do not need DXC at configure
      # time.

      # NOTE: `--gates` is deliberately NOT run here, and adding it will not
      # work. The D3D12 backend skips any adapter flagged
      # DXGI_ADAPTER_FLAG_SOFTWARE (packages/rhi-d3d12/src/device_d3d12.cpp),
      # and a hosted runner has no hardware D3D12 adapter, so device creation
      # fails for environmental reasons rather than because anything is broken.
      # Run the gates locally before pushing, or on a self-hosted runner with
      # a real GPU.
      #
      # `--rhi vulkan --gates` (RHI #24) does not change that, and is worth
      # saying explicitly because it looks like it might. Vulkan has no
      # software-adapter rule to trip over, but a hosted runner has no
      # Vulkan-capable driver either - vulkan-1.dll ships with the GPU driver -
      # so volkInitialize fails, and the SPIR-V half of the toolchain needs the
      # Vulkan SDK's own dxcompiler.dll, which is not on the image. Two
      # environmental reasons, the same conclusion.
      #
      # Locally, both are one command each: `solengine gates-gpu` for D3D12 and
      # `solengine gates-vk` for Vulkan, each with its debug layer armed.
      # Shipping GPU work means running both.

  # ── The portability claim, compiled rather than asserted. ────────────────
  # ARCHITECTURE.md says only the backend packages touch a platform API, and a
  # source scan agrees: 10 of the 175 files graphics-api-isolation scans, every
  # one inside its own package. This
  # job is the difference between that being true of the *text* and true of the
  # *compiler* — gcc, no Windows headers, no MSVC.
  #
  # What it proves: core, math, the interface packages, renderer, scene,
  # gameplay, engine and the shared app sources all compile off Windows.
  #
  # What it does not: nothing runs. There is no platform backend and no RHI in
  # this configuration, so the binary logs "No GPU backend compiled in" and
  # exits 1 by design. A green job here is a statement about the code, not about
  # Linux support — Build #17 (non-Windows packaging) is a separate row and is
  # blocked on Platform #9.
  linux:
    name: Compile without Windows (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          cmake --version
          g++ --version

      # No preset: every preset in CMakePresets.json is a Windows one, and
      # inventing a Linux preset would imply a supported configuration this row
      # does not deliver. Both options are off because their packages are
      # Windows-only anyway; naming them makes the intent explicit rather than
      # relying on the `AND WIN32` in the root CMakeLists.
      - name: Configure
        run: cmake -B build-linux -DENGINE_RHI_D3D12=OFF -DENGINE_PLATFORM_WIN32=OFF

      - name: Build
        run: cmake --build build-linux --parallel

      # First execution of this codebase off Windows. 38 of the 88 gates are
      # classified Cpu in kGates and need no device; the rest are Gpu and are
      # skipped by name, not by silence — the run logs how many of how many it
      # executed, so a headless run that quietly does nothing cannot pass.
      - name: Run the headless gates
        run: ./build-linux/bin/sandbox --gates-cpu

  # ── The same gates, instrumented. ────────────────────────────────────────
  # The audit's comparison section named this as one of three places Sol was
  # behind every reference engine: "there is no sanitizer job, no fuzzing, and
  # no crash reporter. Unity, Unreal and Godot all run ASan/UBSan or equivalent
  # in CI."
  #
  # Covers the ~36 Cpu gates and every package they touch — core, math, scene,
  # physics-cpu, assets and the renderer's CPU maths. It does NOT cover GPU
  # code: rhi-d3d12, shaders-dxc, platform-win32, audio-xaudio2 and
  # assets-png-wic are not even compiled here.
  #
  # halt_on_error=1 on purpose. A sanitizer that reports and carries on turns a
  # red build green, which is worse than not running it at all.
  linux-sanitize:
    name: ASan + UBSan (headless gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -B build-asan
          -DENGINE_RHI_D3D12=OFF -DENGINE_PLATFORM_WIN32=OFF
          -DENGINE_SANITIZE=address,undefined
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Run the headless gates, instrumented
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build-asan/bin/sandbox --gates-cpu

  # ── The modularity claim, kept honest. ───────────────────────────────────
  # Every one of these switches is documented in README.md's CMake options
  # table. Before this job existed, -DENGINE_RHI_D3D12=OFF failed at generate
  # time and had done for some time, because packages/shaders was gated behind
  # the D3D12 option while debug-draw linked it unconditionally.
  #
  # Configure only: this job checks that the CMake graph stays coherent across
  # the option matrix. It no longer stops at configure because the sandbox
  # cannot build — main.cpp guards its PNG includes behind ENGINE_HAS_PNG, and
  # the linux job below builds the sandbox with both backends off. Extending
  # this job from configure to build is a separate decision, not a gap.
  #
  # `no-vulkan` joined `no-d3d12` with the second backend. The modularity claim
  # now has two backends to keep honest, and shaders-dxc is shared between them
  # (DXIL for one, SPIR-V for the other), so switching either off must still
  # leave a coherent graph.
  configure-options:
    name: Configure (${{ matrix.preset }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - no-d3d12
          - no-vulkan
          - no-win32
          - no-sandbox
          - no-game
    steps:
      - uses: actions/checkout@v5

      # Which option each preset switches off is stated once, in
      # CMakePresets.json, rather than spelled out again here.
      - name: Configure with preset ${{ matrix.preset }}
        run: cmake --preset ${{ matrix.preset }}
